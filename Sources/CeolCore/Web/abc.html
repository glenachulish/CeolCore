<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script src="abcjs-basic-min.js"></script>
<script src="voices.js"></script>
<script src="abctools.js"></script>
<link rel="stylesheet" href="abcjs-audio.css">
<style>
  /* The page owns its scrolling: a fixed-height flex column with the sheet
     music in its own scroller. Relying on the web view's document scroll is
     unreliable inside SwiftUI (the host may size the view to its content, so
     there is nothing to scroll and programmatic scrolling silently does
     nothing). This way scrolling is always ours to control. */
  html, body {
    margin: 0; padding: 0; background: transparent; -webkit-text-size-adjust: 100%;
    height: 100%; overflow: hidden;
  }
  body { display: flex; flex-direction: column; }
  #scroller {
    flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  #topbar {
    flex: 0 0 auto; z-index: 10;
    background: rgba(247,247,249,0.96);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(0,0,0,0.08);
    padding-bottom: 2px;
  }
  #audio { padding: 4px 8px; }
  #audio.notready { opacity: 0.45; pointer-events: none; }
  #audioMsg { display: none; font: 12px -apple-system, sans-serif; color: #888; padding: 0 12px 4px; }
  #audioMsg.visible { display: block; }
  #ctlRow {
    display: none; align-items: center; gap: 8px; padding: 2px 12px 6px;
    font: 13px -apple-system, sans-serif; color: #666; flex-wrap: wrap;
  }
  #ctlRow.visible { display: flex; }
  #ctlRow select {
    font: 14px -apple-system, sans-serif; padding: 4px 8px;
    border: 1px solid #ccc; border-radius: 8px; background: transparent; color: inherit;
  }
  #ctlRow button, #selInfo button {
    font: 600 13px -apple-system, sans-serif; border: none; border-radius: 8px;
    padding: 5px 11px; background: #e8e8ed; color: #333;
  }
  #ctlRow button.on { background: #2f6f4f; color: white; }
  /* Transpose sits with the other things you do while looking at the music,
     not buried in a details sheet under a heading it has nothing to do with. */
  #transGroup { display: inline-flex; align-items: center; gap: 2px; }
  #transGroup button { padding: 5px 9px; }
  #transVal { min-width: 30px; text-align: center; font-variant-numeric: tabular-nums; }
  /* Speed: two plain labels for everyday use — Fast is simply the tune's
     written tempo — with a slider that sets how slow "Slow" is. Replaces
     abcjs's own numeric warp box (displayWarp is off below). */
  #speedRow {
    display: none; align-items: center; gap: 8px; padding: 0 12px 6px;
    font: 13px -apple-system, sans-serif; color: #666;
  }
  #speedRow.visible { display: flex; }
  /* Slow and Fast are the two controls reached for mid-tune, with the flute
     still up — half a size bigger than the rest so they can be hit without
     looking. */
  #speedRow button {
    font: 600 19px -apple-system, sans-serif; border: none; border-radius: 10px;
    padding: 8px 21px; background: #e8e8ed; color: #333;
  }
  #speedRow button.on { background: #2f6f4f; color: white; }
  .speed-slider-wrap {
    position: relative; flex: 1 1 auto; min-width: 80px; max-width: 190px;
    display: flex; align-items: center;
  }
  #speedSlider { width: 100%; accent-color: #2f6f4f; }
  /* The detent mark: 100% sits dead centre, and the slider sticks there. */
  .speed-centre-tick {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 2px; height: 13px; border-radius: 1px;
    background: currentColor; opacity: 0.35; pointer-events: none;
  }
  #speedVal { min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
  #selInfo {
    display: none; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 4px 12px 6px; font: 13px -apple-system, sans-serif; color: #666;
  }
  #selInfo.visible { display: flex; }
  #selInfo button.loop-active { background: #2f6f4f; color: white; }
  #selInfo button.prac-active { background: #8a5a00; color: white; }
  #selInfo button.danger { background: #b33; color: white; }
  #pracPanel {
    display: none; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 0 12px 8px; font: 13px -apple-system, sans-serif; color: #666;
  }
  #pracPanel.visible { display: flex; }
  #pracPanel input {
    width: 52px; font: 15px -apple-system, sans-serif; padding: 4px;
    border: 1px solid #ccc; border-radius: 6px; text-align: center;
  }
  #paper { padding: 2px 0 16px; }
  #paper svg { max-width: 100%; height: auto; }
  /* Hidden render drives the audio; kept out of sight but laid out so abcjs
     produces real geometry (Pi approach). */
  #hidden { position: absolute; left: -99999px; top: 0; width: 800px; overflow: hidden; }
  /* Cursor: class may land on the group or the leaf, so cover both (Pi CSS). */
  .abc-playing path, .abc-playing rect, .abc-playing ellipse,
  path.abc-playing, rect.abc-playing, ellipse.abc-playing {
    fill: #e67e22 !important; stroke: #e67e22 !important;
  }
  .ceol-sel { fill: #c9a227; pointer-events: none; }

  /* Landscape (music-stand) mode: give the screen to the music. The player
     transport and loop controls stay; decorative chrome steps aside. */
  @media (orientation: landscape) {
    #ctlRow, #soundRow { padding-top: 0; padding-bottom: 2px; }
    #topbar { padding-bottom: 0; }
    .tune-hd { padding: 2px 8px 0; font-size: 13px; }
    #timeline { height: 22px; margin: 1px 8px 2px; }
    #paper { padding-top: 0; }
    .tune-section { padding: 0 4px 2px; }
  }

  /* Night mode. Driven by the app's Appearance setting (html.dark), not the
     system, so Day/Night can be chosen independently of the phone. */
  html.dark #topbar { background: rgba(28,28,30,0.96); border-bottom-color: rgba(255,255,255,0.1); }
  html.dark #paper svg { filter: invert(0.88) hue-rotate(180deg); }
  html.dark #ctlRow, html.dark #selInfo, html.dark #pracPanel, html.dark #speedRow { color: #aaa; }
  html.dark #ctlRow button, html.dark #selInfo button, html.dark #speedRow button { background: #3a3a3f; color: #eee; }
  html.dark #ctlRow button.on, html.dark #selInfo button.loop-active,
  html.dark #speedRow button.on { background: #2f6f4f; color: #fff; }
  html.dark #ctlRow select { border-color: #555; color: #eee; }
  html.dark #audioMsg, html.dark #dbg { color: #999; }

</style>
</head>
<body>
<div id="topbar">
  <div id="audio" style="display:none"></div>
  <div id="audioMsg">Preparing audio…</div>
  <div id="ctlRow">
    <!-- Kept in the page but not on screen: the app's ⋯ menu drives them
         through ceolApplySound(), and every control left on the music costs a
         line of sheet music. The elements stay because syncCtlUI() and the
         voices.js helpers still read and write them. -->
    <select id="instSelect" title="Melody instrument" style="display:none">
      <option value="flute">Irish Flute</option>
      <option value="mflute">Concert Flute</option>
      <option value="whistle">Tin Whistle</option>
      <option value="violin">Fiddle</option>
      <option value="accordion">Accordion</option>
      <option value="banjo">Banjo</option>
      <option value="acoustic_guitar_nylon">Guitar</option>
      <option value="orchestral_harp">Harp</option>
      <option value="acoustic_grand_piano">Piano</option>
    </select>
    <button id="chordsBtn" style="display:none"></button>
    <!-- The click moved up beside the stars, where there is room for it at a
         size you can hit. Kept here, hidden, because ceolSetClick() still
         writes to it and postMetronome() still reads it. -->
    <button id="clickBtn" title="Metronome — tap to cycle off / on / half / double"
            style="display:none">Click</button>
    <!-- Notation size and transpose are driven from the app now: they sit on
         the line with the instrument, where there is room for them, and every
         control kept on the music costs a stave you could have been reading.
         The elements stay because syncCtlUI() still reads and writes them. -->
    <button id="sizeDown" title="Smaller notation" style="display:none">A−</button>
    <button id="sizeUp" title="Larger notation" style="display:none">A+</button>
    <span id="transGroup" title="Transpose in semitones" style="display:none">
      <button id="transDown">♭</button><button id="transVal" title="Tap to reset">0</button><button id="transUp">♯</button>
    </span>
    <button id="dbgBtn" title="Diagnostics" style="display:none">?</button>
  </div>
  <div id="speedRow">
    <button id="speedSlow" title="10% slower">Slow</button>
    <span class="speed-slider-wrap">
      <input id="speedSlider" type="range" min="0" max="100" step="1" value="50"
             title="Playback speed">
      <span class="speed-centre-tick"></span>
    </span>
    <span id="speedVal">100%</span>
    <button id="speedFast" title="10% faster">Fast</button>
    <!-- Only worth offering when you are away from the written tempo. -->
    <button id="speedKeep" title="Write this speed into the tune"
            style="display:none">Keep</button>
  </div>
  <div id="dbg" style="display:none;font:11px -apple-system,sans-serif;color:#888;padding:0 12px 4px"></div>
  <div id="selInfo"></div>
  <div id="pracPanel">
    <span>Start</span><input id="pracStart" type="number" min="20" max="100" value="60">%
    <span>+</span><input id="pracStep" type="number" min="1" max="25" value="5">%
    <span>every</span><input id="pracLoops" type="number" min="1" max="20" value="2"><span>loops</span>
    <span id="pracNow"></span>
  </div>
</div>
<div id="scroller">
  <div id="paper"></div>
</div>
<div id="hidden"></div>
<script>
// Architecture mirrors the Pi (v3 app.js): a HIDDEN plain render provides the
// visualObj for the synth, a VISIBLE responsive render is what you see, and
// notes are matched hidden→visible by sequential index. Cursor highlighting
// and bar timing both go through that map — driving the synth off the
// responsive render is what silently broke the cursor.

var visualObj = null;      // hidden render (audio + timing)
var synthControl = null;
var audioReady = false;
// A bar's length at the tune's WRITTEN tempo, and the same scaled for whatever
// speed is actually playing. Keeping both matters: every cached bar time is in
// the playing clock, and mixing the two is what broke practice mode — the loop
// end was computed at one tempo and compared against events arriving at
// another, so the loop either restarted early or seeked past the end and
// stopped rather than stepping the tempo up.
var baseMsPerMeasure = null;
var msPerMeasure = null;
var currentABC = "";
var currentTranspose = 0;
var playbackEnabled = true;

var hiddenToVis = new Map();
var lastEls = [];

// Notation size: 4 steps combining a real scale factor with bars-per-line,
// so A−/A+ visibly resize the notation rather than just re-wrapping it.
var SIZE_SCALE = [0.8, 1.0, 1.35, 1.8];
var SIZE_MEASURES = [6, 4, 3, 2];
var MAX_SIZE = 4;
var sizeStep = 2;
try {
  var _s = parseInt(localStorage.getItem("ceol.size"), 10);
  if (_s >= 1 && _s <= MAX_SIZE) sizeStep = _s;
} catch (e) {}
function sizeScale() { return SIZE_SCALE[sizeStep - 1] || 1; }
function measuresPerLine() { return SIZE_MEASURES[sizeStep - 1] || 4; }

// The title and friends are drawn only in the hidden render; the visible one
// gets the notes, since the app shows the name above the music already.
function stripDisplayHeaders(abc) {
  return abc.replace(/^(T|C|S|Z|N|O|B|D|F|W|H|R):[^\n]*\n?/gm, "");
}

// Vertical spacing, in UNSCALED units — which is the whole problem: abcjs
// multiplies these by `scale`, so at the largest notation size every gap
// between staves was nearly twice as tall as at normal size, and the screen
// filled with white bands instead of music. Dividing by the scale keeps the
// gaps looking the same however big the notes are. They are minimums; abcjs
// still opens up for high notes, beams and ledger lines.
function spacingFormat() {
  var s = sizeScale();
  return {
    staffsep: Math.round(32 / s),     // between staves (default ~60)
    musicspace: Math.round(6 / s),    // above the first staff
    composerspace: 0,
    titlespace: 0,
    topspace: 0,
    partsspace: Math.round(4 / s)
  };
}

// Wrap settings shared by both renders. `maxSpacing` is the important one:
// abcjs will only stretch a line to fill the staff width up to this multiple
// of its natural note spacing, and the default (2.7) leaves short lines
// stranded with a wide white gap on the right. Letting it stretch further
// fills the page. `lastLineLimit` is kept lower so a two-bar final line isn't
// pulled grotesquely across the whole width, as engraving convention expects.
//
// There used to be a `preferredMeasuresPerLine` here, computed from how busy
// the bars were. It never did anything: rendering the same tune with 2, 3, 4,
// 6, 8 and 12 preferred bars produced identical engravings — same width, same
// number of staves — at every notation size. abcjs's wrap picks its line
// breaks from the spacing limits alone. renderFitted() is what actually
// governs the width now.
function wrapOptions(abc) {
  return {
    minSpacing: 1.4,
    maxSpacing: 6,
    minSpacingLimit: 1,
    lastLineLimit: 3.5
  };
}


// ── Day / Night ─────────────────────────────────────────────────────────────
// The app tells us which appearance to use ("system", "light" or "dark") so
// the sheet music matches the rest of the app rather than the phone's setting.
var themeMode = "system";
function applyTheme() {
  var dark = themeMode === "dark";
  if (themeMode === "system") {
    try { dark = window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) {}
  }
  document.documentElement.classList.toggle("dark", dark);
}
function setTheme(mode) {
  themeMode = mode || "system";
  try { localStorage.setItem("ceol.theme", themeMode); } catch (e) {}
  applyTheme();
}
try { themeMode = localStorage.getItem("ceol.theme") || "system"; } catch (e) {}
applyTheme();
try {
  window.matchMedia("(prefers-color-scheme: dark)")
    .addEventListener("change", function () { if (themeMode === "system") applyTheme(); });
} catch (e) {}

// ── Audio readiness (prevents "plays but silent") ───────────────────────────
var pendingPlay = null;

// iOS suspends the Web Audio context when the app is backgrounded, the screen
// locks, a call arrives, or another app takes audio — and a suspended context
// plays silently rather than failing. Resume it on any user interaction, when
// the page becomes visible again, and via a watchdog while playing, so the
// user never has to leave the screen and come back to get sound.
function resumeAudioContext() {
  try {
    var ctx = ABCJS.synth.activeAudioContext && ABCJS.synth.activeAudioContext();
    if (ctx && ctx.state !== "running" && typeof ctx.resume === "function") {
      ctx.resume();
      return true;
    }
  } catch (e) {}
  return false;
}
["touchstart", "touchend", "click", "pointerdown"].forEach(function (evt) {
  document.addEventListener(evt, resumeAudioContext, { passive: true, capture: true });
});
document.addEventListener("visibilitychange", function () {
  if (!document.hidden) resumeAudioContext();
});
window.addEventListener("focus", resumeAudioContext);
window.addEventListener("pageshow", resumeAudioContext);

// Screen slept mid-tune: pick it up again where it stopped, rebuilding the
// audio if the device was lost. See abctools.js.
ceolWatchForWake(
  function () { return synthControl; },
  function (then) { if (visualObj) primeTune(then); }
);

// Watchdog: if the transport thinks it is playing but the context has been
// suspended underneath it, revive it (and nudge playback if it stalled).
setInterval(function () {
  try {
    if (synthControl && synthControl.isStarted) resumeAudioContext();
  } catch (e) {}
}, 1000);

function setAudioReady(ready) {
  audioReady = ready;
  var el = document.getElementById("audio");
  var msg = document.getElementById("audioMsg");
  if (el) el.classList.toggle("notready", !ready);
  if (msg) msg.classList.toggle("visible", !ready);
}

function whenAudioReady(fn) {
  if (audioReady) { resumeAudioContext(); fn(); }
  else pendingPlay = fn;
}

function flushPendingPlay() {
  var fn = pendingPlay;
  pendingPlay = null;
  if (fn) { resumeAudioContext(); fn(); }
}

// Sound options — instruments, saved choice and audioParams() all live in
// voices.js, shared with the set player.

// ── Speed: Slow ——slider—— Fast ─────────────────────────────────────────────
// The row reads left to right the way the music does: Slow at one end, Fast
// at the other, and the slider between them showing the speed actually in
// use. "Fast" is the tune's written tempo (100%); slide right to 100 and you
// are simply on Fast again. Two taps cover almost every use; the slider is
// there for when a tune needs to come down further. abcjs's own numeric warp
// box is switched off (displayWarp: false) so there is one control, not two.
// speedPct is what actually plays, 40–200% of the written tempo. The range
// runs past 100 because plenty of tunes are written slower than they are
// played — a hornpipe at Q:1/4=88 needs winding up, not down.
var speedPct = 100;
// What the Slow button jumps back to: the last sub-100 speed you chose.
var slowPct = 70;
try {
  // The speed is NOT restored. It used to be saved globally, so winding one
  // set up to 140% left every tune you opened afterwards at 140% with nothing
  // on screen to say why. A speed you didn't choose for this piece is worse
  // than no memory at all — and "Keep" is there to make a speed permanent
  // for a tune that really wants it. Slow's target is still remembered,
  // because that's a preference rather than a property of the music.
  var _sl = parseInt(localStorage.getItem("ceol.slow"), 10);
  if (_sl >= 40 && _sl < 100) slowPct = _sl;
} catch (e) {}

function currentWarp() { return speedPct; }

// The slider runs 0–100 in POSITION units, not percent, so that 100% — the
// written tempo, the thing you keep coming back to — sits dead centre with
// equal travel either side. Left half spans 40–100%, right half 100–200%.
function pctFromPos(pos) {
  var p = Math.max(0, Math.min(100, pos));
  var pct = p <= 50 ? 40 + (p / 50) * 60
                    : 100 + ((p - 50) / 50) * 100;
  return Math.round(pct / 5) * 5;
}
function posFromPct(pct) {
  return pct <= 100 ? ((pct - 40) / 60) * 50
                    : 50 + ((pct - 100) / 100) * 50;
}
// How close to the centre counts as "on the detent".
var SPEED_DETENT = 4;

// Practice mode ramps the tempo itself, so it owns the warp while it runs.
function applySpeed() {
  if (pracEnabled || !synthControl) return;
  // Natively, speed is one property on the player and the file is untouched —
  // so the bar times never move and there is nothing to re-measure. This is
  // the whole reason the audio was moved out of the web view.
  if (nativeMode) {
    transport("speed", { percent: speedPct });
    nativeTempoChanged(speedPct);
    return;
  }
  // Still waiting for the handover? Leave abcjs at its written tempo — warping
  // it now bakes the speed into the waveform about to be handed over, and the
  // player then applies it a second time. Only the fallback path may warp.
  if (nativeAllowed) return;
  // Otherwise through ceolSetWarp, so a change of speed can't kill playback —
  // and so the re-measure happens after the synth has actually been rebuilt
  // rather than on a guessed delay.
  ceolSetWarp(synthControl, speedPct, function () { refreshTiming(); });
}

function syncSpeedUI() {
  var slow = document.getElementById("speedSlow");
  if (!slow) return;
  // Above 100 neither button is lit — you're past "as written", and the
  // number is the honest description of where you are.
  // While practice is on, it owns the tempo — so the whole row shows the ramp
  // rather than whatever the slider was last left at. The thumb then climbs
  // from wherever you started towards 100 as the loop comes round, which is
  // the point of the exercise made visible.
  var shown = pracEnabled ? pracWarp : speedPct;
  slow.classList.toggle("on", shown < 100);
  document.getElementById("speedFast").classList.toggle("on", shown === 100);
  document.getElementById("speedSlider").value = String(Math.round(posFromPct(shown)));
  document.getElementById("speedVal").textContent =
    pracEnabled ? pracWarp + "% practice" : speedPct + "%";
  var keep = document.getElementById("speedKeep");
  if (keep) keep.style.display = (!pracEnabled && speedPct !== 100) ? "" : "none";
}

/// Write the speed you are actually playing at into the tune, so it becomes
/// the tune's own tempo and the slider goes back to 100%.
///
/// Plenty of tunes come in from elsewhere marked far slower or faster than
/// anyone plays them, and correcting that once is better than correcting it
/// every time. abcjs is asked for the written tempo rather than the ABC being
/// parsed here, because it already knows the beat length — a jig marked in
/// dotted crotchets is not the same arithmetic as a reel in crotchets.
document.getElementById("speedKeep").addEventListener("click", function () {
  if (!visualObj || speedPct === 100) return;
  var beatLength = 0.25, written = 0;
  try {
    beatLength = visualObj.getBeatLength() || 0.25;
    written = visualObj.getBpm(visualObj.metaText ? visualObj.metaText.tempo : null);
  } catch (e) { return; }
  if (!written) return;
  // Q: is written in quarter notes, whatever the tune counts in.
  var quarterBpm = Math.round(written * (beatLength / 0.25) * speedPct / 100);
  if (!isFinite(quarterBpm) || quarterBpm < 20 || quarterBpm > 400) return;
  post("saveTempo", { bpm: quarterBpm, percent: speedPct });
});

function saveSpeed() {
  try {
    localStorage.setItem("ceol.slow", String(slowPct));
  } catch (e) {}
}

function setSpeed(pct) {
  // Dragging the slider while practising adjusts the practice speed rather
  // than a setting that has no effect until practice ends. Otherwise the
  // thumb would spring back to the ramp the moment you let go.
  if (pracEnabled) {
    pracWarp = Math.max(40, Math.min(100, Math.round(pct || 60)));
    syncSpeedUI();
    applyWarp();
    return;
  }
  var was = speedPct;
  speedPct = Math.max(40, Math.min(200, pct || 100));
  if (speedPct < 100) slowPct = speedPct;   // remember it for the Slow button
  // A click stop deserves a click: tap the phone's selection haptic the
  // moment the slider settles onto 100%.
  if (speedPct === 100 && was !== 100) {
    try { window.webkit.messageHandlers.haptic.postMessage({}); } catch (e) {}
  }
  saveSpeed(); syncSpeedUI(); applySpeed();
}

// A step at a time, rather than a jump. The slider is fiddly with a thumb on a
// phone; these are the coarse control and want to be usable without looking.
document.getElementById("speedSlow").addEventListener("click", function () {
  setSpeed((pracEnabled ? pracWarp : speedPct) - 10);
});
document.getElementById("speedFast").addEventListener("click", function () {
  setSpeed((pracEnabled ? pracWarp : speedPct) + 10);
});
document.getElementById("speedSlider").addEventListener("input", function () {
  var pos = parseInt(this.value, 10);
  // Stick to the centre: anywhere within the detent snaps to exactly 100%,
  // and the thumb is pulled back to the middle so it feels like a notch.
  if (Math.abs(pos - 50) <= SPEED_DETENT) {
    setSpeed(100);
    return;
  }
  setSpeed(pctFromPos(pos));
});

function syncCtlUI() {
  var inst = document.getElementById("instSelect");
  ceolFillVoiceSelect(inst);
  inst.value = melodyVoice;
  // A saved instrument that no longer matches an option leaves the dropdown
  // blank and the instrument a mystery. Fall back to the flute rather than
  // show nothing.
  if (inst.selectedIndex < 0) { ceolSetVoice("flute"); inst.value = melodyVoice; }
  var btn = document.getElementById("chordsBtn");
  btn.textContent = chordsOn ? "Chords on" : "Chords off";
  btn.classList.toggle("on", chordsOn);
  document.getElementById("sizeDown").disabled = sizeStep <= 1;
  document.getElementById("sizeUp").disabled = sizeStep >= MAX_SIZE;
  syncSpeedUI();
}

document.getElementById("instSelect").addEventListener("change", function () {
  ceolSetVoice(this.value);
  syncCtlUI();
  reloadAudio(true);   // new instrument — the synth has to be rebuilt
});
document.getElementById("chordsBtn").addEventListener("click", function () {
  chordsOn = !chordsOn;
  try { localStorage.setItem("ceol.chords", chordsOn ? "on" : "off"); } catch (e) {}
  syncCtlUI();
  reloadAudio();
});

// The instrument and the chords now live in the app's ⋯ menu, as they already
// did for a set. They are chosen once and then left alone, so keeping them on
// the music cost a line of sheet music on every tune for a decision nobody
// makes twice. Same entry point and same name as set.html, so the app drives
// both the same way.
function ceolApplySound(voiceId, chords) {
  var voiceChanged = voiceId && voiceId !== melodyVoice;

/// Why the last swap between written and repeat-free failed, for the ? panel.
var lastSwapError = "";
/// What abcjs said about the samples: how many notes it loaded, how many it
/// couldn't, and the first complaint. A buffer of the right length made from
/// no samples plays perfect silence, so this is the difference between a
/// diagnosis and a shrug.
var notesLoaded = 0, notesFailed = 0, firstNoteError = "";
var fontFallbackTried = false;

/// A tune with nothing to sound needs no samples, so "none loaded" is honest
/// rather than a failure. Anything with notes on the page should have loaded
/// something.
function tuneLooksEmpty() {
  return document.querySelectorAll("#hidden .abcjs-note").length === 0;
}

/// Hand the tune to the synth and actually build the audio.
///
/// If every note failed and we were reading from the app's own bundle, the
/// scheme answered the check but isn't delivering; drop to the CDN and try
/// once more rather than leave the tune silent.
function primeTune(done) {
  var settled = false;
  function finish() {
    if (settled) return;
    settled = true;
    setAudioReady(true);
    if (done) done();
    // After the caller has rebuilt its maps: the waveform has changed, so the
    // app needs the new one. Every path that re-primes — first render, loop
    // swap, instrument, chords — comes through here, so none can be forgotten.
    offerAudioToApp();
  }
  setTimeout(finish, 8000);
  try {
    var promise = synthControl.setTune(visualObj, true, audioParams());
    if (!promise || !promise.then) { finish(); return; }
    promise.then(function (result) {
      var status = result && result.notesStatus;
      if (status) {
        notesLoaded = (status.loaded ? status.loaded.length : 0)
                    + (status.cached ? status.cached.length : 0);
        notesFailed = status.error ? status.error.length : 0;
        firstNoteError = notesFailed
          ? String(status.error[0] && (status.error[0].message || status.error[0])) : "";
      }
      // Nothing loaded: the samples aren't reaching the synth. One retry from
      // the CDN, then give up.
      //
      // Note the test is on loaded, NOT on failed. abcjs's batch loader ends
      // in `.catch(...)` that logs and resolves undefined, so a batch that
      // failed outright contributes nothing to either list — the report comes
      // back "loaded 0, failed 0" and looks like there was nothing to do. Add
      // that to prime() sizing its buffer from the note sequence regardless,
      // and a tune with no samples at all is a correct-length buffer of pure
      // silence. Which is exactly what turned up on McMahon's Reel.
      if (notesLoaded === 0 && _ceolFontOK && !fontFallbackTried
          && visualObj && !tuneLooksEmpty()) {
        fontFallbackTried = true;
        _ceolFontOK = false;
        settled = true;              // the retry owns finishing from here
        primeTune(done);
        return;
      }
      finish();
    }).catch(function (e) {
      lastSwapError = String((e && (e.message || e)) || "unknown");
      finish();
    });
  } catch (e) {
    lastSwapError = String((e && (e.message || e)) || "threw");
    finish();
  }
}

function requestSaveTransposed() {
  // Send the outcome either way. abcjs declines to transpose a few tunes —
  // highland-pipe keys (K:Hp) among them — and when that happened this posted
  // an empty string, the app dropped it, and the button appeared to do
  // nothing at all.
  var abc = transposedABC();
  try {
    window.webkit.messageHandlers.saveTransposed.postMessage({
      abc: abc || "", steps: currentTranspose
    });
  } catch (e) {}
}

document.getElementById("sizeDown").addEventListener("click", function () {
  if (sizeStep > 1) { sizeStep--; saveSize(); renderVisible(); }
});
document.getElementById("sizeUp").addEventListener("click", function () {
  if (sizeStep < MAX_SIZE) { sizeStep++; saveSize(); renderVisible(); }
});
// The app owns the notation size now, the same way it owns the metronome and
// the instrument: it says, this draws. Keeping a copy on each side is what let
// the click button and the app disagree about whether the click was on.
function ceolSetSize(n) {
  var next = Math.min(MAX_SIZE, Math.max(1, parseInt(n, 10) || sizeStep));
  if (next === sizeStep) return;
  sizeStep = next;
  saveSize();
  renderVisible();
}
function ceolMaxSize() { return MAX_SIZE; }

function saveSize() {
  try { localStorage.setItem("ceol.size", String(sizeStep)); } catch (e) {}
  syncCtlUI();
}

// Rebuild the synth from scratch.
//
// setTune() alone is not enough for an instrument change: the controller has
// already primed its samples, and re-tuning it keeps playing the old ones — so
// picking a different instrument did nothing until you left the tune and came
// back (a fresh web view, a fresh controller). Tearing it down and building a
// new one is exactly what reopening did, so it is guaranteed to work.
//
// `full` is true for an instrument change; a chords on/off toggle only needs
// the cheaper re-tune.
function reloadAudio(full) {
  if (!visualObj) return;

  if (full && synthControl) {
    try { synthControl.pause(); } catch (e) {}
    try {
      if (synthControl.midiBuffer && synthControl.midiBuffer.stop) {
        synthControl.midiBuffer.stop();
      }
    } catch (e) {}
    try { synthControl.disable(true); } catch (e) {}
    synthControl = null;
    document.getElementById("audio").innerHTML = "";
  }

  if (!synthControl) {
    synthControl = new ABCJS.synth.SynthController();
    synthControl.load("#audio", cursorControl, {
      displayLoop: false,
      displayRestart: true,
      displayPlay: true,
      displayProgress: true,
      displayWarp: false
    });
    ceolGuardTransport(synthControl);
  }

  setAudioReady(false);
  // Prime here too. Changing instrument or chords rebuilds the synth, and
  // leaving the samples to be fetched on the next press of play means the
  // buffer in hand belongs to the settings you just changed away from.
  primeTune(function () {
    applySpeed();
    // A new controller means new DOM and a new timing source.
    buildBarTimingMap();
  });
}

// ── Bar structures ──────────────────────────────────────────────────────────
var barMap = [];
var barFirstMs = {};
var barSel = { start: null, end: null };
var barLooping = false;
var loopSeeking = false;

var pracEnabled = false;
var pracLoopCount = 0;
var pracWarp = 60;

function measureNum(el) {
  if (!el || !el.classList) return null;
  for (var i = 0; i < el.classList.length; i++) {
    var m = el.classList[i].match(/^abcjs-m(\d+)$/);
    if (m) return parseInt(m[1], 10);
  }
  return null;
}

function findMeasure(el, stopAt) {
  var t = el;
  while (t && t !== stopAt) {
    var m = measureNum(t);
    if (m !== null) return m;
    t = t.parentElement;
  }
  return null;
}

/// The bars inside any rendered container, in order.
function buildBarMapIn(container) {
  var bars = [];
  if (!container) return bars;
  container.querySelectorAll(".abcjs-staff-wrapper").forEach(function (wrapper) {
    var buckets = {};
    wrapper.querySelectorAll(".abcjs-note, .abcjs-rest").forEach(function (el) {
      var m = findMeasure(el, wrapper);
      if (m === null) return;
      (buckets[m] = buckets[m] || []).push(el);
    });
    Object.keys(buckets).map(Number).sort(function (a, b) { return a - b; })
      .forEach(function (m) { bars.push({ wrapper: wrapper, m: m, els: buckets[m] }); });
  });
  return bars;
}

function buildBarMap() {
  barMap = buildBarMapIn(document.getElementById("paper"));
}

function barIndexFor(wrapper, m) {
  for (var i = 0; i < barMap.length; i++) {
    if (barMap[i].wrapper === wrapper && barMap[i].m === m) return i;
  }
  return -1;
}

function barBBox(bar) {
  var els = bar.wrapper.querySelectorAll(".abcjs-m" + bar.m);
  var box = null;
  els.forEach(function (el) {
    if (el.hasAttribute && el.hasAttribute("data-ceol-tap")) return;
    var cls = el.getAttribute("class") || "";
    if (/\babcjs-(bar|ending)\b/.test(cls) || /\babcjs-bar-/.test(cls)) return;
    if (typeof el.getBBox !== "function") return;
    var b;
    try { b = el.getBBox(); } catch (e) { return; }
    if (!b || !b.width) return;
    if (!box) box = { x: b.x, y: b.y, x2: b.x + b.width, y2: b.y + b.height };
    else {
      box.x = Math.min(box.x, b.x); box.y = Math.min(box.y, b.y);
      box.x2 = Math.max(box.x2, b.x + b.width); box.y2 = Math.max(box.y2, b.y + b.height);
    }
  });
  return box;
}

function drawTapTargets() {
  barMap.forEach(function (bar) {
    if (bar.wrapper.querySelector('rect[data-ceol-tap="1"][data-bar-m="' + bar.m + '"]')) return;
    var box = barBBox(bar);
    if (!box) return;
    var h = box.y2 - box.y;
    var pad = h * 0.4;
    var r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    r.setAttribute("x", box.x - 1);
    r.setAttribute("y", box.y - pad);
    r.setAttribute("width", (box.x2 - box.x) + 2);
    r.setAttribute("height", h + pad * 2);
    r.setAttribute("fill-opacity", "0");
    r.setAttribute("stroke-opacity", "0");
    r.setAttribute("data-ceol-tap", "1");
    r.setAttribute("data-bar-m", bar.m);
    r.setAttribute("class", "abcjs-m" + bar.m);
    bar.wrapper.appendChild(r);
  });
}

function updateBarShading() {
  document.querySelectorAll(".ceol-sel").forEach(function (el) { el.remove(); });
  if (barSel.start === null) return;
  var pending = barSel.end === null;
  var lo = barSel.start;
  var hi = pending ? barSel.start : barSel.end;
  for (var i = lo; i <= hi && i < barMap.length; i++) {
    var bar = barMap[i];
    var tap = bar.wrapper.querySelector('rect[data-ceol-tap="1"][data-bar-m="' + bar.m + '"]');
    var x, y, w, h;
    if (tap) {
      x = +tap.getAttribute("x"); y = +tap.getAttribute("y");
      w = +tap.getAttribute("width"); h = +tap.getAttribute("height");
      var inset = h * 0.18;
      y += inset; h = Math.max(4, h - inset * 2);
    } else {
      var box = barBBox(bar);
      if (!box) continue;
      x = box.x - 2; y = box.y - 6;
      w = (box.x2 - box.x) + 4; h = (box.y2 - box.y) + 12;
    }
    var r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    r.setAttribute("x", x); r.setAttribute("y", y);
    r.setAttribute("width", w); r.setAttribute("height", h);
    r.setAttribute("rx", "4");
    r.setAttribute("fill-opacity", pending ? "0.16" : "0.24");
    r.setAttribute("pointer-events", "none");
    r.setAttribute("class", "ceol-sel");
    bar.wrapper.insertBefore(r, bar.wrapper.firstChild);
  }
}

function updateSelectionInfo() {
  var el = document.getElementById("selInfo");
  var prac = document.getElementById("pracPanel");
  if (barSel.start === null) {
    el.classList.remove("visible");
    prac.classList.remove("visible");
    sendLoopToApp();      // cleared: the app must stop looping too
    return;
  }
  var pending = barSel.end === null;
  var lo = barSel.start + 1;
  var hi = (pending ? barSel.start : barSel.end) + 1;
  var label = lo === hi ? "Bar " + lo : "Bars " + lo + "–" + hi;
  el.classList.add("visible");
  if (pending) {
    el.innerHTML = "<span>" + label + " — playing from here; tap another bar to set the loop end</span>"
      + '<button id="selClear" class="danger">✕ Clear</button>';
    prac.classList.remove("visible");
  } else {
    el.innerHTML = "<span>" + label + "</span>"
      + '<button id="loopToggle" class="' + (barLooping ? "loop-active" : "") + '">'
      + (barLooping ? "⟳ Looping" : "⟳ Loop off") + "</button>"
      + '<button id="pracToggle" class="' + (pracEnabled ? "prac-active" : "") + '">🎯 Practice</button>'
      + '<button id="selClear" class="danger">✕ Clear</button>';
    document.getElementById("loopToggle").addEventListener("click", function () {
      barLooping = !barLooping;
      updateSelectionInfo();
      syncSynthSource();
    });
    document.getElementById("pracToggle").addEventListener("click", function () {
      setPractice(!pracEnabled);
    });
    prac.classList.toggle("visible", pracEnabled);
  }
  document.getElementById("selClear").addEventListener("click", clearBarSel);
  // Every route into a changed selection ends here, so this is the one place
  // the app needs telling what to loop.
  sendLoopToApp();
}

function setPractice(on) {
  pracEnabled = on;
  pracLoopCount = 0;
  if (on) {
    barLooping = true;
    syncSynthSource();
    pracWarp = parseInt(document.getElementById("pracStart").value, 10) || 60;
    applyWarp();
  } else if (synthControl) {
    // Practice mode is done ramping: hand the tempo back to Slow / Fast.
    document.getElementById("pracNow").textContent = "";
    applySpeed();
  }
  updateSelectionInfo();
  syncSpeedUI();
}

function applyWarp() {
  if (!synthControl) return;
  document.getElementById("pracNow").textContent = "→ now " + pracWarp + "%";
  // Natively the ramp is a single property change — no teardown, no stale bar
  // times, nothing to stall. The loop points are at the written tempo and stay
  // where they are.
  if (nativeMode) {
    transport("speed", { percent: pracWarp });
    nativeTempoChanged(pracWarp);
    return;
  }
  // setWarp rebuilds the whole synth, so wait for it before touching timing.
  // Every bar time has just moved, and the loop start we seeked to a moment
  // ago was on the old clock; put the playhead back at the top of the loop on
  // the new one.
  ceolSetWarp(synthControl, pracWarp, function () {
    refreshTiming(function () {
      if (pracEnabled && barLooping && barSel.start !== null) seekToBar(barSel.start);
    });
  });
}

/// The speed actually playing, as a percentage of the written tempo.
function activeWarp() {
  return pracEnabled ? pracWarp : speedPct;
}

/// Re-measure everything the loop depends on, at the speed now playing.
///
/// setWarp rebuilds the synth's timing, so `barFirstMs` — captured from the
/// timer's note times — is stale the moment the tempo changes. It has to be
/// rebuilt, and a bar's length rescaled to match, or the loop compares times
/// from two different clocks. Deferred slightly because abcjs recalculates its
/// timings after setWarp returns.
function refreshTiming(then) {
  var pct = activeWarp() || 100;
  if (baseMsPerMeasure) msPerMeasure = baseMsPerMeasure * 100 / pct;
  postTempo();
  setTimeout(function () {
    if (baseMsPerMeasure) msPerMeasure = baseMsPerMeasure * 100 / (activeWarp() || 100);
    buildBarTimingMap();
    postTempo();
    if (then) then();
  }, 80);
}

/// Beats in a bar, as a musician counts them: 6/8 is two dotted crotchets,
/// not six quavers, and a metronome clicking six to a jig bar is useless.
function beatsPerBarFromMeter() {
  var m = (currentABC.match(/^M:\s*(\S+)/m) || [])[1] || "4/4";
  if (m === "C") return 4;
  if (m === "C|") return 2;
  var parts = m.split("/");
  var top = parseInt(parts[0], 10);
  var bottom = parseInt(parts[1], 10);
  if (!top || !bottom) return 4;
  if (bottom === 8 && top % 3 === 0) return top / 3;   // 6/8, 9/8, 12/8
  return top;
}

/// Tell the app the tempo actually being played, so the metronome can click
/// with the tune rather than at some default. Derived from what abcjs uses to
/// play it, which is the only figure that's right for every tune — barely one
/// tune in ten carries a written Q:.
function postTempo() {
  if (!msPerMeasure || !isFinite(msPerMeasure)) return;
  var beats = beatsPerBarFromMeter();
  var bpm = Math.round(beats * 60000 / msPerMeasure);
  if (!isFinite(bpm) || bpm < 20 || bpm > 400) return;
  try {
    window.webkit.messageHandlers.tempo.postMessage({ bpm: bpm, beatsPerBar: beats });
  } catch (e) {}
}

function pracOnLoopCycle() {
  if (!pracEnabled) return;
  pracLoopCount++;
  var every = parseInt(document.getElementById("pracLoops").value, 10) || 2;
  var step = parseInt(document.getElementById("pracStep").value, 10) || 5;
  if (pracLoopCount % every === 0 && pracWarp < 100) {
    pracWarp = Math.min(100, pracWarp + step);
    applyWarp();
    syncSpeedUI();      // the readout follows the ramp
  }
}

function clearBarSel() {
  barSel = { start: null, end: null };
  barLooping = false;
  loopSeeking = false;
  if (pracEnabled) setPractice(false);
  updateBarShading();
  updateSelectionInfo();
  syncSynthSource();   // back to the tune as written, repeats and all
}

// Tap a bar: first tap sets the start AND starts playing from there (Pi
// behaviour); second tap sets the end and turns looping on.
document.getElementById("paper").addEventListener("click", function (e) {
  if (!barMap.length) { buildBarMap(); drawTapTargets(); }
  var paper = document.getElementById("paper");
  var el = e.target, measure = null;
  while (el && el !== paper) {
    var cls = (el.getAttribute && el.getAttribute("class")) || "";
    if (/\babcjs-bar\b|\babcjs-bar-/.test(cls)) return;
    measure = measureNum(el);
    if (measure !== null) break;
    el = el.parentElement;
  }
  if (measure === null) return;
  var wrapper = el.closest(".abcjs-staff-wrapper");
  if (!wrapper) return;
  var idx = barIndexFor(wrapper, measure);
  if (idx === -1) return;

  // ONE TAP IS A LOOP. See the same change in set.html for the reasoning:
  // the two-tap version left a state that looked like a selection but wasn't
  // one, and pressing play there ran off to the repeat at the end of the
  // section instead of honouring what you had chosen.
  //
  //   tap a bar        → loop that bar
  //   tap further on   → extend the loop to there
  //   tap before it    → extend it backwards
  //   tap inside it    → shrink to that bar
  //   tap the one bar  → loop off
  var start = barSel.start, end = barSel.end;

  if (start === null || end === null) {
    barSel = { start: idx, end: idx };
    barLooping = true;
    updateBarShading();
    updateSelectionInfo();
    // Take the repeats out first — the bar times all move when they go, so
    // seeking before that lands in the old timing. syncSynthSource seeks and
    // resumes once the new audio is actually built; if there was nothing to
    // change, it calls straight back.
    syncSynthSource(function () { seekToBar(barSel.start); });
  } else if (start === end && idx === start) {
    // Tapping the single bar you are looping turns it off.
    barSel = { start: null, end: null };
    barLooping = false;
    updateBarShading();
    updateSelectionInfo();
    syncSynthSource();
  } else {
    if (idx < start) barSel = { start: idx, end: end };
    else if (idx > end) barSel = { start: start, end: idx };
    else barSel = { start: idx, end: idx };   // inside: start again from there
    // Already linear, so nothing to rebuild — just move the playhead.
    updateBarShading();
    updateSelectionInfo();
    seekToBar(barSel.start);
  }
});

/// Move the playhead to a bar. Deliberately does NOT start playing.
///
/// It used to, which then scrolled the music to follow the notes — and the bar
/// you were reaching for to close a loop moved out from under your finger.
/// Choosing a passage and playing it are two different intentions; the play
/// button is for the second. If it was already playing, it stays playing and
/// simply jumps there.
function startPlaybackAtBar(idx) {
  if (!synthControl) return;
  whenAudioReady(function () { seekToBar(idx); });
}

// ── Timing map: hidden note → visible bar ───────────────────────────────────
function buildBarTimingMap() {
  barFirstMs = {};
  if (!synthControl || !synthControl.timer) return;
  var events = synthControl.timer.noteTimings;
  if (!events || !events.length) return;
  if (!barMap.length) buildBarMap();
  for (var i = 0; i < events.length; i++) {
    var ev = events[i];
    if (!ev || !ev.elements) continue;
    ev.elements.forEach(function (grp) {
      (grp || []).forEach(function (hiddenEl) {
        var el = hiddenToVis.get(hiddenEl);
        if (!el || !el.closest) return;
        var wrapper = el.closest(".abcjs-staff-wrapper");
        if (!wrapper) return;
        var m = findMeasure(el, wrapper);
        if (m === null) return;
        var idx = barIndexFor(wrapper, m);
        if (idx === -1) return;
        if (!Object.prototype.hasOwnProperty.call(barFirstMs, idx)) {
          barFirstMs[idx] = ev.milliseconds;
        }
      });
    });
  }
}

function barMs(barIndex) {
  if (Object.prototype.hasOwnProperty.call(barFirstMs, barIndex)) return barFirstMs[barIndex];
  var keys = Object.keys(barFirstMs).map(Number).sort(function (a, b) { return a - b; });
  if (keys.length > 1 && msPerMeasure) {
    var lastKey = keys[keys.length - 1];
    return barFirstMs[lastKey] + (barIndex - lastKey) * msPerMeasure;
  }
  return msPerMeasure ? barIndex * msPerMeasure : 0;
}

function seekToBar(barIndex, retried) {
  if (!synthControl) return;
  // Natively the bar times and the file are on the same clock — the written
  // tempo — so a seek is just the bar's own time. No fraction, no rescaling,
  // nothing that can go stale when the speed changes.
  if (nativeMode) {
    var ms = barMs(barIndex);
    if (isFinite(ms)) transport("seek", { seconds: ms / 1000 });
    return;
  }
  var buf = synthControl.midiBuffer;
  if (!buf || !buf.duration) return;
  var fraction = barMs(barIndex) / (buf.duration * 1000);
  // A stale time can land past the end, where seeking finishes the tune
  // instead of looping it — which read as "it just stopped".
  //
  // Refusing was right, but refusing and giving up was not: the times are
  // stale precisely when the speed has just changed, which is every few
  // rounds of practice, and a loop that declines to come round again is a
  // loop that has stopped. Re-measure and try once more on the new clock.
  if (!isFinite(fraction) || fraction >= 0.999) {
    if (retried) return;
    refreshTiming(function () { seekToBar(barIndex, true); });
    return;
  }
  loopSeeking = true;
  synthControl.seek(Math.max(0, fraction));
  setTimeout(function () { loopSeeking = false; }, 250);
}

// ── Cursor + follow scroll ──────────────────────────────────────────────────
function unhighlight() {
  lastEls.forEach(function (el) { el.classList.remove("abc-playing"); });
  lastEls = [];
}

// Where the lit note actually is, as a reader would say it — see set.html.
function litWhere() {
  if (!lastEls.length) return "nothing";
  var notes = Array.prototype.slice.call(
    document.querySelectorAll("#paper .abcjs-note"));
  return "note " + (notes.indexOf(lastEls[0]) + 1) + "/" + notes.length;
}

var lastFollowAt = 0;
function followHighlight(el) {
  // Only chase the music while it is actually sounding. Choosing a loop moves
  // the playhead to the first bar you picked, which lights a note, which used
  // to scroll the page — so the second bar you were about to tap slid out from
  // under your finger. Following is for reading along, not for browsing.
  if (!(synthControl && synthControl.isStarted)) return;
  var now = Date.now();
  if (now - lastFollowAt < 350) return;
  var scroller = document.getElementById("scroller");
  var sRect = scroller.getBoundingClientRect();
  var eRect = el.getBoundingClientRect();
  // Already comfortably in view? Leave the reader alone.
  if (eRect.top >= sRect.top + 8 && eRect.bottom <= sRect.bottom - sRect.height * 0.18) return;
  lastFollowAt = now;
  var target = scroller.scrollTop + (eRect.top - sRect.top) - sRect.height * 0.35;
  target = Math.max(0, Math.min(target, scroller.scrollHeight - scroller.clientHeight));
  if (typeof scroller.scrollTo === "function") {
    scroller.scrollTo({ top: target, behavior: "smooth" });
  } else {
    scroller.scrollTop = target;
  }
}

// Diagnostics: tap "?" to show what the cursor/scroll machinery sees.
var dbgOn = false;
// The app's own ? button, in the strip under the title. Same thing the button
// on the music did — it sits up there instead now, so the development panel
// isn't taking a place in the row of controls you'd actually be using.
function ceolToggleDiagnostics() {
  var b = document.getElementById("dbgBtn");
  if (b) b.click();
}

document.getElementById("dbgBtn").addEventListener("click", function () {
  // The audio figures below are read from the player, and the player only
  // reported them once, when the file landed — before a note had played, so
  // the latency and the node's clock rate were still zero. Ask again on the
  // way in, so what you are looking at is what is happening now.

// staffwidth is in SCALED pixels — it is NOT divided by the scale.
//
// It used to be, on the reasoning that a scaled-up render needs a smaller
// request to come out the right size. That reasoning is wrong, and measurably
// so: rendering the library at each notation size and reading back the width
// abcjs actually produced, the engraving covered 75% of the screen at A+ in
// landscape and 59% at A++. The missing quarter to two-fifths is the white
// space down both margins. Passing the container width undivided puts every
// size at 100%.
function staffWidth() {
  // On paper, engrave to a page rather than to the phone: a fixed width means
  // the PDF looks the same whatever notation size happens to be selected.
  if (printMode) return 680;
  var el = document.getElementById("paper");
  var w = (el && el.clientWidth) ? el.clientWidth : 700;
  // 24 leaves a hair of breathing room at each edge once the 10px paddings
  // are added back, so notes never touch the side of the screen.
  return Math.max(180, w - 24);
}

// abcjs's wrap mode treats staffwidth as a hint, not a target: it settles on
// its own line width and leaves whatever is left over as white. So don't
// argue with it — measure it. Render, read the width it chose, and if it
// missed the container by more than 2%, scale the request by the ratio and
// render again, keeping whichever attempt landed closer. One render in the
// common case, three at worst.
// The tune object from the most recent draw, so the repeat-sign cure below can
// look at what was actually engraved.
var ceolLastDrawn = null;

function renderFitted(containerId, abc, opts) {
  function draw(sw, source, options) {
    var o = {};
    var from = options || opts;
    for (var k in from) o[k] = from[k];
    o.staffwidth = sw;
    ceolLastDrawn = (ABCJS.renderAbc(containerId, source || abc, o) || [])[0] || null;
    var svg = document.querySelector("#" + containerId + " svg");
    return svg ? (parseFloat(svg.getAttribute("width")) || 0) : 0;
  }
  var base = staffWidth();
  var w = draw(base);
  if (!printMode && w) {
    var el = document.getElementById(containerId);
    var target = el && el.clientWidth ? el.clientWidth : 0;
    if (target && Math.abs(w - target) / target > 0.02) {
      var w2 = draw(base * (target / w));
      if (!w2 || Math.abs(w2 - target) > Math.abs(w - target)) { w = draw(base); }
      else { base = base * (target / w); w = w2; }
    }
  }

// ── Repeat signs stranded at the end of a line ──────────────────────────────
//
// abcjs's line wrapping is free to put ANY barline last on a system, including
// one that OPENS a repeat — a `|:` or a `::`. That is wrong engraving: a
// repeat that opens a section belongs at the START of the next system, and
// what you see instead is a set of dots facing right into the margin at the
// far edge of the page, which reads as a mistake. Addie Harper's Jig and A
// Tune for Lewis both showed it.
//
// It is not rare. Rendering a sample of the library at three widths, 17% of
// engravings stranded a repeat this way.
//
// abcjs gives no way to ask for it directly. Measured, in order of how much
// they disturb the layout:
//   • `preferredMeasuresPerLine` — no effect at all, at any value.
//   • explicit `$` line breaks, or `lineBreaks` as a render option — ignored
//     while `wrap` is on, and `wrap` is what makes the music responsive.
//   • a small change of staff width — moves abcjs's breaks, and usually enough.
//     Cures 85 of the 99 bad engravings in the sample, at a width change of at
//     most 12%, which is not visible.
//   • re-laying the tune out with our own line breaks and `wrap` off — cures
//     the rest. Kept last because abcjs then fills nothing itself, so the
//     lines are only as even as we make them.
// Together: 17% → 0%, with the average number of staves per tune going from
// 4.96 to 4.98. That last number is the point — the cure costs no layout.
function ceolStrandsRepeat(tune) {
  var lines = ((tune && tune.lines) || []).filter(function (l) { return l.staff; });
  return lines.some(function (line) {
    var bars = (line.staff[0].voices[0] || []).filter(function (e) { return e.el_type === "bar"; });
    var last = bars[bars.length - 1];
    return !!last && (last.type === "bar_left_repeat" || last.type === "bar_dbl_repeat");
  });
}

function ceolNoteCount(tune) {
  var n = 0;
  ((tune && tune.lines) || []).forEach(function (line) {
    if (!line.staff) return;
    (line.staff[0].voices[0] || []).forEach(function (e) { if (e.el_type === "note") n++; });
  });
  return n;
}

/// Our own break points: a steady number of bars per line, never ending on a
/// barline that opens a repeat.
function ceolEvenBreaks(tune) {
  var lines = ((tune && tune.lines) || []).filter(function (l) { return l.staff; });
  var bars = [];
  lines.forEach(function (line) {
    (line.staff[0].voices[0] || []).forEach(function (e) {
      if (e.el_type === "bar" && typeof e.endChar === "number") bars.push(e);
    });
  });
  if (lines.length < 2 || !bars.length) return [];
  var per = Math.max(1, Math.round(bars.length / lines.length));
  var points = [], run = 0;
  for (var i = 0; i < bars.length - 1; i++) {
    run++;
    if (run < per) continue;
    var at = i;
    if (bars[at].type === "bar_left_repeat" || bars[at].type === "bar_dbl_repeat") {
      if (at > 0) at--; else { run = 0; continue; }
    }
    points.push(bars[at].endChar);
    run = 0;
  }
  return points;
}

function ceolApplyBreaks(abc, points) {
  var out = abc;
  points.slice().sort(function (a, b) { return b - a; }).forEach(function (at) {
    if (at <= 0 || at >= out.length) return;
    // A BLANK line ends the tune in ABC. Where there is already a break, leave
    // it: making a second one silently truncates the music.
    if (/^[ \t]*\n/.test(out.slice(at))) return;
    out = out.slice(0, at) + "\n" + out.slice(at).replace(/^[ \t]+/, "");
  });

var CEOL_WIDTH_NUDGES = [0.97, 1.03, 0.94, 1.06, 0.91, 1.09, 0.88, 1.12];

function ceolCureStrandedRepeat(containerId, abc, opts, base, draw, tune) {

  var staves = ((tune.lines) || []).filter(function (l) { return l.staff; }).length;

// Port of the Pi's _patchSvgViewBox, extended to include content that abcjs
// draws OUTSIDE the declared width/height (long titles and composer lines can
// start left of x=0, which clips them). Setting the viewBox to the real
// content bounds and width to 100% guarantees everything stays visible at
// every size.
function patchSvgViewBox(containerId) {
  document.querySelectorAll("#" + containerId + " svg").forEach(function (svg) {
    var w = parseFloat(svg.getAttribute("width"));
    var h = parseFloat(svg.getAttribute("height"));
    if (!w || !h) return;
    var x = 0, y = 0, vw = w, vh = h;
    try {
      var bb = svg.getBBox();
      if (bb && bb.width) {
        // Grow the box by the SAME amount on both sides. Expanding only to the
        // left (a long title can start at a negative x) shifted the staff off
        // to the right inside the viewBox, which read as the music sitting
        // off-centre with a gap down one side. A symmetric pad keeps the staff
        // — which abcjs centres within 0..w — centred in the finished SVG.
        var padLeft = Math.max(0, -(bb.x - 2));
        var padRight = Math.max(0, (bb.x + bb.width + 2) - w);
        var pad = Math.max(padLeft, padRight);
        x = -pad;
        vw = w + pad * 2;
        y = Math.min(0, bb.y - 2);
        vh = Math.max(h, bb.y + bb.height + 2) - y;

    svg.setAttribute("viewBox", x + " " + y + " " + vw + " " + vh);
    svg.setAttribute("preserveAspectRatio", "xMidYMin meet");

    // width to 100% would stretch every size step to fill the screen, undoing
    // the A-/A+ scaling; capping at the container keeps it from clipping.

    svg.style.maxWidth = "100%";

// header that steps aside the moment playback starts, so the click became
// unreachable at exactly the moment it was wanted. A panel was the wrong shape
// anyway: this is an on/off you reach for mid-tune, not a form to fill in.
//
// Tapping cycles off → on → half → double → off. The tempo still comes from
// the music, so there is nothing else to set.
var clickState = 0;   // 0 off, 1 half, 2 normal, 3 double
// Half time first, because that is where it now starts — see Metronome.swift.
// A metronome, drawn rather than named. "Click" said what it did but took the
// width of a word to do it; the shape says the same thing and leaves room for
// the beat beside it, which is the part you actually need to see at a glance.
var METRONOME_SVG =
  '<svg viewBox="0 0 16 16" width="13" height="13" style="vertical-align:-2px" aria-hidden="true">'
  + '<path d="M5.7 1.6h4.6l3.1 12.8H2.6z" fill="none" stroke="currentColor"'
  + ' stroke-width="1.4" stroke-linejoin="round"/>'
  + '<path d="M8 13 10.7 4.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>'
  + '</svg>';
var CLICK_LABELS = ["", "½", "1×", "2×"];
var CLICK_RATES = [0.5, 0.5, 1, 2];

function syncClickButton() {
  var b = document.getElementById("clickBtn");
  if (!b) return;
  var rate = CLICK_LABELS[clickState];
  b.innerHTML = METRONOME_SVG + (rate ? ' <span style="font-size:12px">' + rate + '</span>' : '');
  b.classList.toggle("on", clickState > 0);
}

// The app telling the page what the metronome is really doing.
//
// The button and the app each kept their own idea of whether the click was on,
// so turning it on in the panel left the button still reading "Click". The
// same two-copies pattern that made the play/pause symbol lie. The app owns
// the metronome, so the app says; this only draws what it is told and never
// posts back, which is what stops the two of them talking in circles.
function ceolSetClick(on, rate) {
  var state = 0;
  if (on) state = (rate < 0.75) ? 1 : (rate > 1.5 ? 3 : 2);
  if (state === clickState) return;
  clickState = state;
  syncClickButton();
}

function postMetronome() {
  try {
    window.webkit.messageHandlers.metronome.postMessage({
      on: clickState > 0, rate: CLICK_RATES[clickState]
    });
  } catch (e) {}
}

(function () {
  var b = document.getElementById("clickBtn");
  if (!b) return;
  b.addEventListener("click", function () {
    clickState = (clickState + 1) % 4;
    syncClickButton();
    postMetronome();
    try { window.webkit.messageHandlers.haptic.postMessage({}); } catch (e) {}
  });
  syncClickButton();
})();

</script>
</body>
</html>
