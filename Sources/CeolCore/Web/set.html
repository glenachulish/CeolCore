  // music ignored it and ran off to the repeat at the end of the section,
  // which reads as the app throwing your choice away. And because looping only
  // began on the second tap, that tap was also when the audio was rebuilt
  // without repeats, so every bar time moved and playback lurched.
  //
  // Now the first tap makes a complete one-bar loop. There is no half-made
  // state to be caught in, play always does what the shading shows, and the
  // rebuild happens once, at the moment you first ask for a loop — extending
  // it afterwards only recomputes times.
  //
  //   tap a bar        → loop that bar
  //   tap further on   → extend the loop to there
  //   tap before it    → extend it backwards
  //   tap inside it    → shrink to that bar
  //   tap the one bar  → loop off
  var g = globalIdx(tapped);

  if (!selA || !selB) {
    // First tap of a new selection.
    selA = selB = tapped;
    barLooping = true;
    // Re-prime without the repeats — the bar times all move when they go, so
    // the loop times can only be worked out once that has finished.
    syncLoopSource(function () {
      computeLoopTimes();
      if (loopStartMsCache !== null && audioReady) seekMs(loopStartMsCache);
    });
  } else {
    var lo = globalIdx(selA), hi = globalIdx(selB);
    if (lo === hi && g === lo) {
      // Tapping the single bar you are looping turns it off. Somewhere to put
      // a loop back that doesn't mean finding the Clear button.
      clearLoop();
      updateLoopShading();
      updateLoopRow();
      return;
    }
    if (g < lo) selA = tapped;
    else if (g > hi) selB = tapped;
    else selA = selB = tapped;    // inside: start again from there
    // Already linear, so nothing to rebuild — just the times.
    computeLoopTimes();
    if (loopStartMsCache !== null && audioReady) seekMs(loopStartMsCache);
  }
  updateLoopShading();
  updateLoopRow();
  });
});

// Internal |: :| repeats are notated once but PLAYED twice, so each hidden
// bar records both its FIRST and LAST milliseconds (see buildTimingAndMaps).
var hiddenBarLastMs = [];
// Total according to TimingCallbacks (the written-tempo clock), kept so the
// synth's clock can be reconciled with it — see buildTimingAndMaps.
var timingTotalMs = 0;
// Whether the coloured blocks are sized by real time or still by bar counts,
// and if the latter, why — it is otherwise invisible when it silently fails.
var timelineMode = "not sized yet";

// Hidden playback index of (tune t, bar j) at repeat r.
/// The bar in the combined music for bar `j` of tune `t` on pass `r`.
///
/// Looked up in that tune's own list of bars rather than counted from the
/// start of the set, so a join that leaves a part-bar behind can't push
/// everything after it out of step.
function hiddenIdx(t, j, r) {
  var mine = hiddenBarsByTune[t];
  if (mine && mine.length) {
    var per = visBars[t] ? visBars[t].length : 0;
    var wanted = per ? (r * per + j) : j;
    if (wanted >= mine.length) wanted = mine.length - 1;
    return mine[Math.max(0, wanted)];
  }
  // Nothing has been timed yet — fall back to counting, which is right often
  // enough to seek roughly the right place before playback has started.
  var offset = 0;
  for (var u = 0; u < t; u++) offset += visBars[u].length * tuneReps[u];
  return offset + r * visBars[t].length + j;
}

function hiddenMs(idx) {
  if (idx >= 0 && idx < hiddenBarMs.length && hiddenBarMs[idx] !== undefined) {
    return hiddenBarMs[idx];
  }
  return null;
}

function computeLoopTimes() {
  loopStartMsCache = loopEndMsCache = null;
  loopUnsetReason = "";
  if (!selA || !selB || !hiddenBarMs.length) return;
  var cross = selA.t !== selB.t;
  var start, end;

  if (cross) {
    // Transition practice, repeats ignored: play the FINAL pass of the first
    // tune's selected bars (last tune-level repeat AND last pass of any
    // internal |: :| repeat) into the FIRST pass of the second tune — each
    // selected bar sounds exactly once per cycle.
    var startIdx = hiddenIdx(selA.t, selA.j, tuneReps[selA.t] - 1);
    var endIdx = hiddenIdx(selB.t, selB.j, 0);
    start = (startIdx < hiddenBarLastMs.length && hiddenBarLastMs[startIdx] !== undefined)
      ? hiddenBarLastMs[startIdx] : hiddenMs(startIdx);
    var endBarMs = hiddenMs(endIdx);
    var afterEnd = hiddenMs(endIdx + 1);
    // If the bar after the end sits beyond a replay (end bar closes an
    // internal repeat), clamp to one bar's length — first pass only.
    if (endBarMs !== null && afterEnd !== null
        && afterEnd > endBarMs + msPerBarEst * 1.5) {
      end = endBarMs + msPerBarEst;
    } else if (afterEnd !== null) {
      end = afterEnd;
    } else {
      end = endBarMs !== null ? endBarMs + msPerBarEst : null;
    }
  } else {
    // Same-tune loop: first repeat, repeat-aware end (Pi logic).
    var sIdx = hiddenIdx(selA.t, selA.j, 0);
    var eIdx = hiddenIdx(selB.t, selB.j, 0);
    start = hiddenMs(sIdx);
    var eMs = hiddenMs(eIdx);
    var aEnd = hiddenMs(eIdx + 1);
    if (eMs !== null && aEnd !== null && aEnd > eMs + msPerBarEst * 1.5) {
      end = eMs + msPerBarEst;
    } else if (aEnd !== null) {
      end = aEnd;
    } else {
      end = eMs !== null ? eMs + msPerBarEst : null;
    }
  }

  // A loop outside the audio is worse than none: seeking there lands past the
  // end, playback finishes the instant it starts, and it reads as "the sound
  // stopped working". If the times can't be trusted, rebuild the map once and
  // try again; if they still don't fit, leave the loop unset.
  if (durationMs && (start >= durationMs || end > durationMs) && !loopRetried) {
    loopRetried = true;
    buildTimingAndMaps();
    computeLoopTimes();
    loopRetried = false;
    return;
  }
  if (start !== null && start !== undefined && end !== null && end > start
      && (!durationMs || (start < durationMs && end <= durationMs))) {
    loopStartMsCache = start;
    loopEndMsCache = end;
  } else {
    loopUnsetReason = "start " + Math.round(start) + " end " + Math.round(end)
      + " vs duration " + Math.round(durationMs || 0);
  }
  // Whatever we settled on, the app is doing the looping — tell it.
  sendLoopToApp();
}
var loopRetried = false;
var loopUnsetReason = "";

// Bumped by every deliberate move of the playhead. syncLoopSource takes a
// copy before it rebuilds and only puts the position back if the number hasn't
// changed — otherwise its restore would undo a seek someone asked for in the
// meantime, which is exactly what tapping a third bar does.
var seekIntent = 0;

function seekMs(ms) {
  if (!synthControl || !durationMs) return;
  seekIntent++;
  loopSeeking = true;
  synthControl.seek(Math.max(0, Math.min(1, ms / durationMs)));
  setTimeout(function () { loopSeeking = false; }, 250);
}

// ── Timeline ────────────────────────────────────────────────────────────────
// How long each tune takes, measured by abcjs rather than guessed.
//
// The widths used to come from counting "|" characters, which is wrong in
// three separate ways: |: and || count as bars when they aren't, a tune with
// internal repeats sounds twice as long as its bar count suggests, and a jig
// bar and a reel bar don't take the same time. Across the library that put 69
// of 112 sets out by more than five points of width, and one by sixty-three.
//
// Rendering each tune on its own and asking abcjs for its total time removes
// all three: it's the same engine that plays the notes, so repeats, metre and
// tempo are already accounted for.
var tuneDurMs = [];
// Per tune, so the metronome can change gear with the set: how long one bar
// takes at the tune's written tempo, and how many beats a musician counts in it.
var tuneMsPerBar = [];
var tuneBeats = [];

function measureTuneDurations() {
  tuneDurMs = [];
  tuneMsPerBar = [];
  tuneBeats = [];
  if (!setData || !setData.tunes) return;
  var host = document.getElementById("measureRender");
  setData.tunes.forEach(function (t) {
    var ms = 0, msPerBar = 0;
    try {
      var out = ABCJS.renderAbc(host, cleanABC(t.abc), { add_classes: true });
      var vo = out && out[0];
      if (vo) {
        // Constructing the timer is what fills in the tune's total time;
        // there's no lighter way to ask for it.
        new ABCJS.TimingCallbacks(vo, {});
        var secs = vo.getTotalTime();
        if (secs > 0) ms = secs * 1000;
        msPerBar = vo.millisecondsPerMeasure();
      }
    } catch (e) {}
    tuneDurMs.push(ms);
    tuneMsPerBar.push(msPerBar);
    tuneBeats.push(beatsPerBarFor(t.abc));
  });
  host.innerHTML = "";
}

/// Beats in a bar as a musician counts them: a jig is two dotted crotchets,
/// not six quavers, and a metronome clicking six to a jig bar is no use.
function beatsPerBarFor(abc) {
  var m = ((abc || "").match(/^M:\s*(\S+)/m) || [])[1] || "4/4";
  if (m === "C") return 4;
  if (m === "C|") return 2;
  var parts = m.split("/");
  var top = parseInt(parts[0], 10), bottom = parseInt(parts[1], 10);
  if (!top || !bottom) return 4;
  if (bottom === 8 && top % 3 === 0) return top / 3;   // 6/8, 9/8, 12/8
  return top;
}

/// Tell the app the tempo of the tune now sounding, adjusted for the Slow /
/// Fast setting. Sent whenever the set moves to a different tune or the speed
/// changes, so the click follows the set through a change of gear.
var lastPostedTempo = "";
function postTempoForTune(idx) {
  if (idx < 0 || idx >= tuneMsPerBar.length) return;
  var msPerBar = tuneMsPerBar[idx], beats = tuneBeats[idx];
  if (!msPerBar || !beats) return;
  var pct = speedPct || 100;
  var bpm = Math.round(beats * 60000 / (msPerBar * 100 / pct));
  if (!isFinite(bpm) || bpm < 20 || bpm > 400) return;
  var signature = bpm + "/" + beats;
  if (signature === lastPostedTempo) return;
  lastPostedTempo = signature;
  try {
    window.webkit.messageHandlers.tempo.postMessage({ bpm: bpm, beatsPerBar: beats });
  } catch (e) {}
}

/// Where each tune begins and ends, as fractions of the whole set.
///
/// Two sources, best first. Once the set has been timed, the boundaries come
/// from the music that is actually playing — nothing can be more accurate than
/// that, and the marker reads the same clock, so the two cannot disagree.
/// Until then, and if the timing map comes out unusable, the measured
/// durations above stand in. What this never falls back to is counting bar
/// lines, which is where the old widths came from and why they were wrong.
function tuneFractions() {
  var n = (setData && setData.tunes) ? setData.tunes.length : 0;
  if (!n) return null;
  return observedFractions(n) || measuredFractions(n);
}

function observedFractions(n) {
  if (!durationMs || tuneStartMs.length < n) return null;
  var bounds = [];
  for (var i = 0; i < n; i++) {
    var v = tuneStartMs[i];
    // Every boundary has to be known, in order, and inside the piece. A
    // partial map is worse than the estimate: when this was silently wrong it
    // put a tune's start later than the whole set.
    if (v === undefined || v >= durationMs) { timelineMode = "measured (gap at " + i + ")"; return null; }
    if (i > 0 && v <= bounds[i - 1]) { timelineMode = "measured (out of order)"; return null; }
    bounds.push(v);
  }
  timelineMode = "played";
  var out = bounds.map(function (v) { return v / durationMs; });
  out[0] = 0;
  out.push(1);
  return out;
}

function measuredFractions(n) {
  var spans = [], total = 0;
  for (var i = 0; i < n; i++) {
    var d = (tuneDurMs[i] || 0) * (tuneReps[i] || 1);
    spans.push(d);
    total += d;
  }
  if (!total) { timelineMode = "equal (nothing measured)"; return null; }
  var bounds = [0], acc = 0;
  for (var j = 0; j < n; j++) { acc += spans[j]; bounds.push(acc / total); }
  timelineMode = "measured";
  return bounds;   // n + 1 values, 0 … 1
}

// The bare name for the strip. A title like "Blackberry Blossom #1 (G maj)"
// carries its key so it can be told from the other settings in the library;
// on a four-inch coloured block it just crowds out the name you're reading.
function bareTitle(title) {
  return String(title || "").replace(/\s*\([^()]*\)\s*$/, "").trim() || String(title || "");
}

function buildTimeline(tunes) {
  var el = document.getElementById("timeline");
  var bounds = tuneFractions();
  el.innerHTML = "";
  tunes.forEach(function (t, i) {
    var seg = document.createElement("div");
    seg.className = "seg seg-" + ((i % 4) + 1);
    var pct = bounds ? (bounds[i + 1] - bounds[i]) * 100 : (100 / tunes.length);
    seg.style.width = Math.max(2, pct).toFixed(2) + "%";
    seg.innerHTML = "<span>" + bareTitle(t.title) + "</span>";
    seg.addEventListener("click", function () { seekToTune(i); });
    el.appendChild(seg);
  });
  var prog = document.createElement("div");
  prog.id = "progress";
  el.appendChild(prog);
  fitTimelineLabels();
}

// The strip stays exactly one screen wide, always showing the whole set.
//
// It briefly didn't. To give the labels room I widened the whole strip and let
// it scroll — proportions intact, names in full. But the strip is the progress
// bar: making it wider than the screen meant a four-tune set showed two tunes,
// and where you are in the set is the thing it exists to tell you. A label is
// worth less than that. So the names moved out to their own scrolling row
// above, and the bar went back to fitting the screen. Those names have since
// gone too — the slash line in the page header above says the same thing.
function fitTimelineLabels() {
  var el = document.getElementById("timeline");
  if (el) el.style.width = "100%";
}



// Kept as a hook for the repeat steppers and playback start: the widths come
// from the measured durations, which don't depend on playback having begun.
function resizeTimeline() {
  if (!setData || !setData.tunes) return;
  var segs = document.querySelectorAll("#timeline .seg");
  if (segs.length !== setData.tunes.length) { timelineMode = "equal (seg count)"; return; }
  var bounds = tuneFractions();
  if (!bounds) return;
  for (var i = 0; i < segs.length; i++) {
    segs[i].style.width = Math.max(2, (bounds[i + 1] - bounds[i]) * 100).toFixed(2) + "%";
  }
  // The shares just moved, so the width that makes every name fit has moved too.
  fitTimelineLabels();
}

/// Which tune the playhead is in, by elapsed time rather than by character
/// position — the marker and the colours then cannot disagree, because they
/// are reading the same number.
function tuneIdxForMs(ms) {
  var bounds = tuneFractions();
  if (!bounds || !durationMs) return -1;
  var f = Math.max(0, Math.min(0.999999, ms / durationMs));
  for (var i = 0; i + 1 < bounds.length; i++) {
    if (f >= bounds[i] && f < bounds[i + 1]) return i;
  }
  return bounds.length - 2;
}

function setActiveTune(idx, fromCursor) {
  // A jump you just made outranks the cursor for a moment — see `seekedAt`.
  if (fromCursor && Date.now() - seekedAt < SEEK_GRACE_MS) return;
  if (idx === activeTune || idx < 0) return;
  activeTune = idx;
  postTempoForTune(idx);
  document.querySelectorAll(".seg").forEach(function (s, i) {
    s.classList.toggle("active", i === idx);
  });
  document.querySelectorAll(".tune-section").forEach(function (s, i) {
    s.classList.toggle("active", i === idx);
  });
}

// Where the lit note actually IS, in the reader's terms: which tune of the
// set, and how far into it. Read alongside the clock, this separates a wrong
// map from a wrong tempo without needing another round of guessing.
function litWhere() {
  if (!lastEls.length) return "nothing";
  var el = lastEls[0];
  var sec = el.closest ? el.closest(".tune-section") : null;
  var t = sec ? parseInt((sec.id || "").replace("tune-section-", ""), 10) : -1;
  if (isNaN(t) || t < 0) return "a note outside any tune";
  var notes = Array.prototype.slice.call(
    document.querySelectorAll("#tune-vis-" + t + " .abcjs-note"));
  return "tune " + (t + 1) + " note " + (notes.indexOf(el) + 1)
    + "/" + notes.length;
}

// Follow the music note by note, scrolling AHEAD so the playing notes are
// never stuck at the bottom of the view (Pi behaviour).
function followNote(el) {
  // Only while it is actually sounding — see abc.html. Selecting a loop lit a
  // note, which scrolled the page out from under the second tap.
  if (!(synthControl && synthControl.isStarted)) return;
  var now = Date.now();
  if (now - lastScrollAt < 300) return;
  var scroller = document.getElementById("scroller");
  if (!scroller) return;
  var sRect = scroller.getBoundingClientRect();
  var eRect = el.getBoundingClientRect();
  // Comfortable band: top 8px to 65% down — anything lower triggers a scroll
  // so the next line or two is already visible.
  if (eRect.top >= sRect.top + 8 && eRect.bottom <= sRect.top + sRect.height * 0.65) return;

  var target = scroller.scrollTop + (eRect.top - sRect.top) - sRect.height * 0.3;
  target = Math.max(0, Math.min(target, scroller.scrollHeight - scroller.clientHeight));
  if (typeof scroller.scrollTo === "function") {
    scroller.scrollTo({ top: target, behavior: "smooth" });
  } else {
    scroller.scrollTop = target;

function scrollToTuneSection(idx) {

  var target = scroller.scrollTop + (section.getBoundingClientRect().top - sRect.top) - 6;

// Tap a timeline segment: jump playback to that tune, show it, and start
// playing if we're stopped — so the notes light up in time from there.
/// When a segment was last clicked.
///
/// The cursor calls `setActiveTune` on every note event, so a click that moved
/// the highlight was undone a few milliseconds later by the next note of the
/// tune still sounding — the seek had not taken effect yet, the cursor was
/// still where it was, and it put the colour back. From the outside the click
/// did nothing at all.
///

/// arrive at the new position, short enough that a wrong guess corrects itself
/// while you are still looking at it.

  // from the measured durations rather than from the note map means tapping a
  // segment lands where the eye says it should, and works before anything has
  // been played.
  var bounds = tuneFractions();

    scrollToTuneSection(idx);
    setActiveTune(idx);
    return;

    } catch (e) {}
  });
}

// ── Cursor control ──────────────────────────────────────────────────────────
// Playback instrumentation. The audio chain reports healthy — buffer built,
// no error, context running — so whatever stops the sound is stopping it from
// outside. These record who, and when.

var pauseLog = [];
var lastJsError = "";

window.addEventListener("error", function (e) {

});
window.addEventListener("unhandledrejection", function (e) {

/// Wrap pause() so a stop can be attributed. Swift calls this via
/// evaluateJavaScript on .ceolStopAllPlayback and on view teardown; abcjs
/// calls it from its own transport. The stack tells them apart.

  synthControl.pause = function () {
    var frame = ((new Error().stack || "").split("\n")[2] || "top-level").trim();
    var at = startedAt ? (Date.now() - startedAt) + "ms in" : "idle";

    //

    // the written tempo — and at any speed other than 100% that is the wrong
    // clock entirely. At 160% the buffer is 150s while the written tempo says
    // 241s, so every bar time is out by a third: loops seek to the wrong bars,
    // the coloured blocks don't match the marker, and the lit note lags. The
    // timer exists by now and is warped exactly as the audio is, so this is
    // the moment to read it.

    // through the event table is the only way to honour a negative one.

      if (at >= 0) shifted = nativeEvents[at].els;

// Rebuild bar maps + tap targets + shading after abcjs responsive re-renders

      // screen stays white. This never happened before: the handler only
      // rebuilt the bar maps, so a set never re-flowed when you turned the
      // phone.

    // still valid, the maps just need repointing.

// Tell the app when playback starts/stops so it can clear the screen for
// reading (the transport's own pause button doesn't fire a callback, so poll

function postPlayState(playing) {
  try { window.webkit.messageHandlers.playState.postMessage({ playing: playing }); } catch (e) {}
}
setInterval(function () {
  var playing = !!(synthControl && synthControl.isStarted);

    postPlayState(playing);

  // only catches a report that went astray. abcjs redraws it solely when it
  // starts or stops something itself, and natively it does neither.

      && synthControl.control.pushPlay) {

// Tell the app when the music has scrolled off the top so the branded header
// above the web view can step aside (see abc.html).

(function () {
  var scroller = document.getElementById("scroller");
  if (!scroller) return;
  scroller.addEventListener("scroll", function () {

    // the-music scrolls this element itself; letting that resize the web view
    // broke loop selection and cut playback short.
    if (Date.now() - lastScrollAt < 1200) return;
    if (synthControl && synthControl.isStarted) return;

// ── Entry point ─────────────────────────────────────────────────────────────
// Guard against being handed the same set twice. loadSet() ends in
// rebuildAudio(), which tears the synth down and builds it again — so an
// unnecessary call in the first second of playback silently kills the sound.
// SwiftUI re-runs updateUIView several times as playback starts (isPlaying
// flips, the chrome hides), and any wobble in its change detection used to
// land here. Belt and braces: even if the app sends an identical payload, we
// do nothing. Only a genuine change gets through.

  setData.tunes = tunes;

  syncSoundUI();

  tuneReps = tunes.map(function (t) { return Math.max(1, Math.min(3, t.repeats || 1)); });

  var sections = document.getElementById("sections");
  sections.innerHTML = "";
  visBars = [];
  tunes.forEach(function (t, i) {
    var div = document.createElement("div");
    div.className = "tune-section";

      + '<span class="name" data-open="' + i + '">' + (i + 1) + ". " + (t.title || "") + '</span>'
      + '<span class="reps">'
      + '<button data-rep="-1" data-idx="' + i + '"' + (tuneReps[i] <= 1 ? " disabled" : "") + '>−</button>'
      + '<span id="rep-val-' + i + '">×' + tuneReps[i] + '</span>'
      + '<button data-rep="1" data-idx="' + i + '"' + (tuneReps[i] >= 3 ? " disabled" : "") + '>+</button>'
      + '</span></div>'

  sections.querySelectorAll(".tune-hd .name").forEach(function (el) {

// (Re)build the hidden combined render and hand it to the synth. Called on
// load and whenever repeats change.
//
// `primeNow` builds the audio there and then, rather than leaving abcjs to do
// it on the first play. It matters when a rebuild throws away a buffer that
// was in use — setting a loop, say — because until the new one exists there is
// nothing to seek into and no bar times to read, so the tune restarts from the
// top and the loop has nothing to work with. Only pass it from a user action.
function rebuildAudio(primeNow) {
  if (!setData || !setData.tunes || !setData.tunes.length) return;
  synthIsLinear = wantLinear();
  combined = buildCombined(setData.tunes);
  if (!combined || !ABCJS.synth.supportsAudio()) return;
  var out = ABCJS.renderAbc("hiddenRender", combined.abc, { add_classes: true });
  hiddenVisual = out && out[0] ? out[0] : null;
  if (!hiddenVisual) return;


  if (!synthControl) {
    synthControl = new ABCJS.synth.SynthController();
    synthControl.load("#audio", cursorControl, {
      displayLoop: false,
      displayRestart: true,
      displayPlay: true,
      displayProgress: true,
      // Our own Slow / Fast row replaces abcjs's numeric warp box.

  // the first set you opened playing in silence while the next one was fine.
  // Always prime for real. abcjs only reports which samples it managed to load
  // when it actually builds the audio — and a buffer of the right length made
  // from no samples plays perfect silence, which is impossible to tell from a
  // broken transport by looking at it.

      .then(function (result) {

            ? String(status.error[0] && (status.error[0].message || status.error[0])) : "";

        // CDN and try once, rather than leave a silent set.
        //

        // loading, repeats, instrument, the loop swap — comes through here.

        // single tune, so this is exactly where a soundfont fetch gives up.

}

// header that steps aside the moment playback starts, so the click became
// unreachable at exactly the moment it was wanted. A panel was the wrong shape
// anyway: this is an on/off you reach for mid-tune, not a form to fill in.
//
// Tapping cycles off → on → half → double → off. The tempo still comes from
// the music, so there is nothing else to set.
var clickState = 0;   // 0 off, 1 half, 2 normal, 3 double
// Half time first, because that is where it now starts — see Metronome.swift.
var CLICK_LABELS = ["Click", "Click ½", "Click 1×", "Click 2×"];
var CLICK_RATES = [0.5, 0.5, 1, 2];

function syncClickButton() {
  var b = document.getElementById("clickBtn");
  if (!b) return;
  b.textContent = CLICK_LABELS[clickState];
  b.classList.toggle("on", clickState > 0);
}

// The app telling the page what the metronome is really doing.
//
// The button and the app each kept their own idea of whether the click was on,
// so turning it on in the panel left the button still reading "Click". The
// same two-copies pattern that made the play/pause symbol lie. The app owns
// the metronome, so the app says; this only draws what it is told and never
// posts back, which is what stops the two of them talking in circles.
function ceolSetClick(on, rate) {
  var state = 0;
  if (on) state = (rate < 0.75) ? 1 : (rate > 1.5 ? 3 : 2);
  if (state === clickState) return;
  clickState = state;
  syncClickButton();
}

function postMetronome() {
  try {
    window.webkit.messageHandlers.metronome.postMessage({
      on: clickState > 0, rate: CLICK_RATES[clickState]
    });
  } catch (e) {}
}

(function () {
  var b = document.getElementById("clickBtn");
  if (!b) return;
  b.addEventListener("click", function () {
    clickState = (clickState + 1) % 4;
    syncClickButton();
    postMetronome();
    try { window.webkit.messageHandlers.haptic.postMessage({}); } catch (e) {}
  });
  syncClickButton();
})();

</script>
</body>
</html>
